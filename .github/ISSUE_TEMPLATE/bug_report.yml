name: Bug report
description: wfwatch shows something wrong, misses something, or crashes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Privacy first.** Claude Code transcripts contain your prompts, code, file paths, command output and sometimes secrets. Do not attach real transcripts, files from `~/.claude` or screenshots of real sessions. Cut a sample down to the fields that matter and replace names, paths and contents with placeholders.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command line, the screen (overview, diagram, cards, session), the terminal size and the keys you pressed.
      placeholder: |
        1. wfwatch -o
        2. press 1
        3. ...
    validations:
      required: true
  - type: input
    id: wfwatch-version
    attributes:
      label: wfwatch version
      description: The output of `wfwatch --version`.
      placeholder: wfwatch 0.2.2
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`. wfwatch reads files whose format changes between Claude Code versions.
      placeholder: 2.1.311 (Claude Code)
    validations:
      required: true
  - type: input
    id: os-terminal
    attributes:
      label: OS and terminal
      placeholder: macOS 15, iTerm2 / Ubuntu 24.04, GNOME Terminal / Windows 11, WSL 2, Windows Terminal
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: The output of `python3 --version` (the Python wfwatch is installed with).
      placeholder: Python 3.12.4
  - type: textarea
    id: details
    attributes:
      label: Error output or an anonymized sample
      description: The traceback printed with `--debug` (check it for names and paths first), or an anonymized line from a transcript that wfwatch does not understand.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed project names, file paths, prompts and command output from everything I attached.
          required: true
